<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧收尾用量系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Microsoft JhengHei';
            background-color: #f0f2f5;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .nav-tab {
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }
        .nav-tab.active {
            color: #4f46e5;
            border-bottom: 3px solid #4f46e5;
            background-color: #e0e7ff;
            font-weight: bold;
        }

        .table-container {
            max-height: calc(100vh - 220px);
            overflow-y: auto;
            overflow-x: auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            width: max-content; 
            min-width: 100%;
        }

        th, td {
            border: 1px solid #e5e7eb;
            text-align: center !important;
            vertical-align: middle;
            padding: 6px;
            box-sizing: border-box;
        }

        /* 表頭樣式鎖定 */
        th {
            position: sticky;
            top: 0;
            background-color: #dbeafe; /* 淡藍色背景 */
            color: #000000 !important; /* 強制黑色 */
            font-weight: 900 !important; /* 強制粗體 */
            font-size: 15px;
            z-index: 10;
            border-bottom: 2px solid #93c5fd;
            white-space: nowrap; /* 確保標題不斷行 */
            padding: 10px 8px !important;
        }
        
        .col-date {
            position: sticky;
            left: 0;
            background-color: #f9fafb;
            z-index: 5;
            font-weight: 600;
            border-right: 2px solid #cbd5e1;
            min-width: 110px;
        }

        th.col-date {
            z-index: 15;
            background-color: #bfdbfe;
            border-right: 2px solid #93c5fd;
        }

        input.cell-input {
            width: 85px; 
            padding: 4px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
            transition: all 0.2s;
            background-color: #ffffff;
        }

        input.cell-input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
            background-color: #eef2ff;
        }
        
        .highlight-cell {
            border-color: #8b5cf6 !important;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.5) !important;
            background-color: #ede9fe !important;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(139, 92, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
        }

        tr.day-start td { border-top: 2px solid #9ca3af; }
        .row-group:hover td { background-color: #f3f4f6; }
        .row-group:hover .col-date { background-color: #e5e7eb; }

        /* Modal Styles */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 50; justify-content: center; align-items: center; padding: 16px; backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
    </style>
</head>
<body class="text-gray-800">

    <nav class="bg-white shadow-md sticky top-0 z-40">
        <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-2">
                    <div class="bg-indigo-600 p-2 rounded-lg text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                    </div>
                    <span class="font-bold text-xl text-gray-800 hidden sm:block">智慧收尾用量系統</span>
                </div>
                <div class="flex space-x-1 sm:space-x-4">
                    <button onclick="switchTab('tab-table')" id="btn-tab-table" class="nav-tab active px-3 sm:px-4 py-2 mt-2 rounded-t-lg text-gray-600 font-medium text-sm sm:text-base flex items-center gap-1">
                        📝 總表檢視
                    </button>
                    <button onclick="switchTab('tab-scan')" id="btn-tab-scan" class="nav-tab px-3 sm:px-4 py-2 mt-2 rounded-t-lg text-gray-600 font-medium text-sm sm:text-base flex items-center gap-1">
                        📱 現場掃碼
                    </button>
                    <button onclick="switchTab('tab-qr')" id="btn-tab-qr" class="nav-tab px-3 sm:px-4 py-2 mt-2 rounded-t-lg text-gray-600 font-medium text-sm sm:text-base flex items-center gap-1">
                        🖨️ QR碼管理
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-[1600px] mx-auto p-4 md:p-6 mt-2">
        
        <!-- 分頁 1：總表 -->
        <div id="tab-table" class="tab-content active">
            <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-4" id="table-controls">
                <h2 class="text-xl font-bold text-gray-700">📅 115年8月份用量總表</h2>
                <div class="flex gap-2">
                    <button onclick="saveData()" id="saveBtn" class="px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg shadow text-sm font-medium transition-colors">
                        💾 暫存資料
                    </button>
                    <button onclick="exportCSV()" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg shadow text-sm font-medium transition-colors">
                        📊 匯出 Excel
                    </button>
                </div>
            </div>

            <div class="table-container" id="table-container-div">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th class="col-date">日期</th>
                            <th>蒸氣高燃鍋爐</th>
                            <th>蒸氣鍋爐2</th>
                            <th>瓦斯1</th>
                            <th>瓦斯2</th>
                            <th>大支自來水</th>
                            <th>小支自來水</th>
                            <th>大支軟水A</th>
                            <th>小支軟水B</th>
                            <th>軟水表1</th>
                            <th>軟水表2</th>
                            <th>猛砂</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Javascript 動態生成 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 分頁 2：現場掃碼 (行動版專屬設計) -->
        <div id="tab-scan" class="tab-content">
            <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg overflow-hidden border border-gray-100">
                <div class="bg-indigo-600 p-6 text-center text-white">
                    <h2 class="text-2xl font-bold mb-2">📸 設備掃碼輸入</h2>
                    <p class="text-indigo-200 text-sm">請選擇今天的日期，然後點擊下方按鈕掃描機台 QR Code。</p>
                </div>
                
                <div class="p-6 flex flex-col gap-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">📍 1. 選擇紀錄日期：</label>
                        <select id="targetDate" class="w-full p-3 rounded-xl border-2 border-indigo-200 bg-indigo-50 font-bold text-indigo-900 outline-none focus:border-indigo-500 transition-colors text-lg cursor-pointer">
                            <!-- JS 生成 -->
                        </select>
                    </div>

                    <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                        <label class="block text-sm font-bold text-gray-700 mb-3">📷 2. 執行掃描：</label>
                        <button onclick="openQRScanner()" class="w-full flex justify-center items-center gap-3 py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-lg transition-transform transform hover:scale-[1.02] active:scale-95 font-bold text-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                            </svg>
                            掃描機台 QR Code
                        </button>
                    </div>
                </div>
            </div>
            
            <div id="aiStatus" class="mt-6 max-w-md mx-auto text-purple-700 font-bold hidden bg-purple-100 p-4 rounded-xl text-center animate-pulse border border-purple-300 shadow-sm">
                🤖 AI 正在判讀照片，請稍候...
            </div>
        </div>

        <!-- 分頁 3：QR 碼管理 -->
        <div id="tab-qr" class="tab-content">
            <div class="bg-white rounded-xl shadow p-6">
                <div class="flex justify-between items-center mb-6 border-b pb-4">
                    <div>
                        <h2 class="text-xl font-bold text-gray-800">🖨️ 設備標籤列印區</h2>
                        <p class="text-sm text-gray-500 mt-1">請將這些標籤印出並貼在現場機台上，方便人員掃描。</p>
                    </div>
                    <button onclick="window.print()" class="px-5 py-2 bg-gray-800 hover:bg-gray-900 text-white rounded-lg shadow font-medium flex items-center gap-2">
                        列印本頁
                    </button>
                </div>
                <div id="qrCodesContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                    <!-- Javascript 生成 QR Code -->
                </div>
            </div>
        </div>

    </div>

    <!-- AI 辨識結果確認 Modal (關鍵需求) -->
    <div id="confirmModal" class="modal">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm mx-4 transform transition-all">
            <div class="text-center mb-6">
                <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100 mb-3">
                    <svg class="h-6 w-6 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
                <h3 class="text-lg leading-6 font-bold text-gray-900" id="confirm-title">AI 辨識完成</h3>
                <p class="text-sm text-gray-500 mt-2">請確認以下數值，若有誤可直接點擊修改。</p>
            </div>
            
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 mb-6">
                <p class="text-xs text-gray-500 font-bold mb-1 uppercase tracking-wider">設備名稱</p>
                <p class="text-base font-bold text-indigo-700 mb-4" id="confirm-device-name">蒸氣高燃鍋爐</p>
                
                <p class="text-xs text-gray-500 font-bold mb-1 uppercase tracking-wider">辨識結果 (可編輯)</p>
                <input type="text" id="confirm-value-input" class="w-full text-center text-2xl font-black text-gray-800 p-3 border-2 border-indigo-300 rounded-lg focus:border-indigo-600 focus:outline-none transition-colors">
            </div>

            <div class="flex gap-3">
                <button onclick="closeConfirmModal()" class="w-1/2 px-4 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-bold transition-colors">
                    取消重拍
                </button>
                <button onclick="submitConfirmedData()" class="w-1/2 px-4 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-md transition-colors">
                    確認寫入
                </button>
            </div>
        </div>
    </div>

    <!-- QR 掃描器 Modal -->
    <div id="qrModal" class="modal">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm mx-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">📷 掃描條碼</h2>
                <button onclick="closeQRScanner()" class="text-gray-400 hover:text-red-500 font-bold text-2xl">&times;</button>
            </div>
            <div id="qr-reader" class="w-full bg-black rounded-xl overflow-hidden shadow-inner"></div>
        </div>
    </div>

    <!-- 隱藏的上傳按鈕 -->
    <input type="file" id="singleMeterInput" accept="image/*" capture="environment" class="hidden" onchange="handleSingleMeterUpload(event)">

    <script>
        const dates = [
            '08/17 (週一)', '08/18 (週二)', '08/19 (週三)', '08/20 (週四)',
            '08/21 (週五)', '08/22 (週六)', '08/23 (週日)', '08/24 (週一)',
            '08/25 (週二)', '08/26 (週三)', '08/27 (週四)', '08/28 (週五)',
            '08/29 (週六)', '08/30 (週日)', '08/31 (週一)'
        ];

        // 系統核心品項定義 (符合您的最新要求)
        const items = [
            { id: 'boiler1', label: '蒸氣高燃鍋爐', hasOpenClose: true },
            { id: 'boiler2', label: '蒸氣鍋爐2', hasOpenClose: true },
            { id: 'gas1', label: '瓦斯1', hasOpenClose: false },
            { id: 'gas2', label: '瓦斯2', hasOpenClose: false },
            { id: 'water_l', label: '大支自來水', hasOpenClose: false },
            { id: 'water_s', label: '小支自來水', hasOpenClose: false },
            { id: 'soft_a', label: '大支軟水A', hasOpenClose: false },
            { id: 'soft_b', label: '小支軟水B', hasOpenClose: false },
            { id: 'soft_m1', label: '軟水表1', hasOpenClose: false },
            { id: 'soft_m2', label: '軟水表2', hasOpenClose: false },
            { id: 'meng', label: '猛砂', hasOpenClose: false }
        ];

        // 系統狀態變數
        let html5QrcodeScanner = null;
        let pendingScanItem = null; // 記錄當前正在處理的設備
        let pendingDateIndex = null; // 記錄當前選擇的日期

        window.onload = () => {
            initTable();
            initDateSelector();
            loadData();
            generateQRCodesForPrint();
            
            // 處理 URL 帶入的 QR Code 參數 (相機直掃功能)
            const urlParams = new URLSearchParams(window.location.search);
            const qrParam = urlParams.get('qr');
            if (qrParam) {
                switchTab('tab-scan');
                setTimeout(() => processScannedCode(qrParam), 500);
            }
        };

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            document.getElementById(`btn-${tabId}`).classList.add('active');
        }

        function initDateSelector() {
            const selector = document.getElementById('targetDate');
            dates.forEach((date, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.text = date;
                selector.appendChild(option);
            });
            // 預設跳到今天 (這裡簡單預設為陣列最後一天前，您可以依需求改)
            selector.value = dates.length > 2 ? 12 : 0; 
        }

        function initTable() {
            const tbody = document.getElementById('tableBody');
            
            dates.forEach((date, index) => {
                const tbodyGroup = document.createElement('tbody');
                tbodyGroup.className = 'row-group';

                const tr1 = document.createElement('tr');
                tr1.className = 'day-start';
                
                // 日期欄
                const tdDate = document.createElement('td');
                tdDate.rowSpan = 2;
                tdDate.className = 'col-date';
                tdDate.innerText = date;
                tr1.appendChild(tdDate);

                // 產生第一行 (包含 開 的格子與單一格子)
                items.forEach(item => {
                    if (item.hasOpenClose) {
                        tr1.innerHTML += `<td><span class="text-[10px] text-gray-400 absolute -ml-3 mt-1">開</span>
                                          <input type="text" class="cell-input" id="${item.id}_s_${index}" data-id="${item.id}_s_${index}"></td>`;
                    } else {
                        tr1.innerHTML += `<td rowspan="2">
                                          <input type="text" class="cell-input" id="${item.id}_${index}" data-id="${item.id}_${index}"></td>`;
                    }
                });

                // 產生第二行 (只包含 收 的格子)
                const tr2 = document.createElement('tr');
                items.forEach(item => {
                    if (item.hasOpenClose) {
                        tr2.innerHTML += `<td><span class="text-[10px] text-gray-400 absolute -ml-3 mt-1">收</span>
                                          <input type="text" class="cell-input" id="${item.id}_e_${index}" data-id="${item.id}_e_${index}"></td>`;
                    }
                });

                tbodyGroup.appendChild(tr1);
                tbodyGroup.appendChild(tr2);
                tbody.appendChild(tbodyGroup);
            });
        }

        function openQRScanner() {
            document.getElementById('qrModal').classList.add('active');
            html5QrcodeScanner = new Html5Qrcode("qr-reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            
            html5QrcodeScanner.start({ facingMode: "environment" }, config, 
                (decodedText) => {
                    html5QrcodeScanner.stop().then(() => {
                        document.getElementById('qrModal').classList.remove('active');
                        processScannedCode(decodedText);
                    });
                },
                (err) => {}
            ).catch(err => {
                alert("無法存取相機，請確認已給予權限。");
                closeQRScanner();
            });
        }

        function closeQRScanner() {
            document.getElementById('qrModal').classList.remove('active');
            if(html5QrcodeScanner) html5QrcodeScanner.stop().catch(e=>{});
        }

        function processScannedCode(code) {
            let finalCode = code.includes('?qr=') ? code.split('?qr=')[1] : code;
            const matchedItem = items.find(i => i.id === finalCode);
            
            if (matchedItem) {
                pendingScanItem = matchedItem;
                pendingDateIndex = parseInt(document.getElementById('targetDate').value);
                
                // 喚醒相機
                document.getElementById('singleMeterInput').click();
            } else {
                alert("無效的設備條碼：" + code);
            }
        }

        async function handleSingleMeterUpload(event) {
            const file = event.target.files[0];
            if (!file || !pendingScanItem) return;

            document.getElementById('aiStatus').classList.remove('hidden');

            try {
                const base64Data = (await convertFileToBase64(file)).split(',')[1];
                
                // 提示詞要求 AI 保留 : 符號
                const prompt = `這是一張工廠儀表板或是手寫數字的照片。請你判讀這張照片上的數值。
                規則：
                1. 請「只」回傳你判讀出來的數字本身，絕對不要有其他廢話。
                2. 如果是手寫算式(例如 11860:46 或 11801=59)，請完整回傳原始符號與數字。
                3. 無法辨識請回傳空字串。`;

                const resultText = await callGeminiAPI(prompt, base64Data, file.type);
                const aiValue = resultText.trim().replace(/^null$/i, ''); // 過濾 null 字串

                // 隱藏 AI 處理狀態，顯示確認 Modal
                document.getElementById('aiStatus').classList.add('hidden');
                showConfirmModal(aiValue);

            } catch (error) {
                console.error(error);
                document.getElementById('aiStatus').classList.add('hidden');
                alert("辨識發生錯誤，請重新拍攝。");
            } finally {
                event.target.value = ''; // Reset input
            }
        }

        function showConfirmModal(initialValue) {
            document.getElementById('confirm-device-name').innerText = pendingScanItem.label;
            document.getElementById('confirm-value-input').value = initialValue;
            document.getElementById('confirmModal').classList.add('active');
            
            // 自動聚焦輸入框方便直接修改
            setTimeout(() => {
                document.getElementById('confirm-value-input').focus();
            }, 100);
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('active');
            pendingScanItem = null;
        }

        // ================= 重點：確認寫入與開收連動邏輯 =================
        function submitConfirmedData() {
            const finalValue = document.getElementById('confirm-value-input').value.trim();
            if(!finalValue) {
                alert("請輸入數值"); return;
            }

            const item = pendingScanItem;
            const dateIdx = pendingDateIndex;

            if (item.hasOpenClose) {
                // 邏輯：填入「今天」的「收」 (_e)
                const todayCloseId = `${item.id}_e_${dateIdx}`;
                const todayCloseInput = document.getElementById(todayCloseId);
                if (todayCloseInput) todayCloseInput.value = finalValue;

                // 邏輯：填入「明天」的「開」 (_s)
                if (dateIdx + 1 < dates.length) {
                    const tmrOpenId = `${item.id}_s_${dateIdx + 1}`;
                    const tmrOpenInput = document.getElementById(tmrOpenId);
                    if (tmrOpenInput) tmrOpenInput.value = finalValue;
                }
            } else {
                // 一般品項直接填入
                const inputId = `${item.id}_${dateIdx}`;
                const inputEl = document.getElementById(inputId);
                if (inputEl) inputEl.value = finalValue;
            }

            // 儲存資料並關閉 Modal
            saveData();
            closeConfirmModal();
            
            // 跳轉回總表看結果，並加上高光特效
            switchTab('tab-table');
            highlightUpdatedCells(item.id, dateIdx, item.hasOpenClose);
        }

        function highlightUpdatedCells(itemId, dateIdx, hasOpenClose) {
            document.querySelectorAll('input').forEach(i => i.classList.remove('highlight-cell'));
            
            let targetId = hasOpenClose ? `${itemId}_e_${dateIdx}` : `${itemId}_${dateIdx}`;
            let targetEl = document.getElementById(targetId);
            
            if (targetEl) {
                targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                targetEl.classList.add('highlight-cell');
                
                if (hasOpenClose && dateIdx + 1 < dates.length) {
                    let tmrEl = document.getElementById(`${itemId}_s_${dateIdx + 1}`);
                    if(tmrEl) tmrEl.classList.add('highlight-cell');
                }
                
                setTimeout(() => {
                    document.querySelectorAll('input').forEach(i => i.classList.remove('highlight-cell'));
                }, 3000);
            }
        }

        async function callGeminiAPI(prompt, base64Data, mimeType) {
            const apiKey = ""; // 注意：實際部署需替換
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ role: "user", parts: [{ text: prompt }, { inlineData: { mimeType: mimeType, data: base64Data } }] }]
            };

            const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (!response.ok) throw new Error(`API error`);
            const result = await response.json();
            return result.candidates[0].content.parts[0].text;
        }

        function convertFileToBase64(file) {
            return new Promise((res, rej) => { const r = new FileReader(); r.readAsDataURL(file); r.onload = () => res(r.result); r.onerror = rej; });
        }

        function generateQRCodesForPrint() {
            const container = document.getElementById('qrCodesContainer');
            container.innerHTML = '';
            const baseUrl = window.location.href.split('?')[0];

            items.forEach(item => {
                const qrData = encodeURIComponent(`${baseUrl}?qr=${item.id}`);
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${qrData}`;
                container.innerHTML += `
                    <div class="flex flex-col items-center justify-center p-4 border-2 border-dashed border-gray-300 rounded-xl bg-gray-50">
                        <img src="${qrUrl}" alt="${item.label}" class="w-28 h-28 mb-3 bg-white p-1 rounded shadow-sm">
                        <span class="font-bold text-gray-800 text-center">${item.label}</span>
                    </div>
                `;
            });
        }

        function saveData() {
            const inputs = document.querySelectorAll('#dataTable input');
            const data = {};
            inputs.forEach(input => {
                if(input.value.trim() !== '') { data[input.getAttribute('data-id')] = input.value; }
            });
            localStorage.setItem('factory_system_v1', JSON.stringify(data));
            
            const btn = document.getElementById('saveBtn');
            if(btn) {
                const ori = btn.innerHTML;
                btn.innerHTML = '✔️ 已儲存';
                setTimeout(() => { btn.innerHTML = ori; }, 2000);
            }
        }

        function loadData() {
            const saved = localStorage.getItem('factory_system_v1');
            if (saved) {
                const data = JSON.parse(saved);
                for (const key in data) {
                    const input = document.getElementById(key);
                    if (input) { input.value = data[key]; }
                }
            } else {
                // 預設寫入測試資料 (符合您的需求)
                const defaultInputs = {
                    'boiler1_e_12': '11860:46', // 8/29 收
                    'boiler1_s_13': '11860:46'  // 8/30 開
                };
                for (const key in defaultInputs) {
                    const input = document.getElementById(key);
                    if (input) input.value = defaultInputs[key];
                }
                saveData();
            }
        }

        function exportCSV() {
            let csvContent = "\uFEFF";
            
            // 建立 CSV 表頭
            const headers = ['日期'];
            items.forEach(item => {
                if (item.hasOpenClose) { headers.push(`${item.label}(開)`, `${item.label}(收)`); }
                else { headers.push(item.label); }
            });
            csvContent += headers.join(",") + "\r\n";

            // 建立 CSV 資料
            dates.forEach((date, i) => {
                let row = [date];
                items.forEach(item => {
                    if (item.hasOpenClose) {
                        row.push(document.getElementById(`${item.id}_s_${i}`).value || '');
                        row.push(document.getElementById(`${item.id}_e_${i}`).value || '');
                    } else {
                        row.push(document.getElementById(`${item.id}_${i}`).value || '');
                    }
                });
                csvContent += row.join(",") + "\r\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "用量總表_匯出.csv";
            link.click();
        }
    </script>
</body>
